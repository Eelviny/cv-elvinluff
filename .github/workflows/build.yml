name: Build CV

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest-full
    defaults:
      run:
        shell: bash
    steps:
      # The TeX Live image is Debian with TeX but no Node.js, and GitHub's own
      # JS actions (checkout, upload-artifact) run inside this container.
      - name: Install git and Node.js for the runner actions
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ca-certificates curl
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash - > /dev/null
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nodejs
          node --version && git --version

      - name: Checkout (with AltaCV submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Compile
        run: make

      - name: Fail on LaTeX errors in the log
        run: |
          if grep -n '^!' elvinluff.log; then
            echo "::error::LaTeX reported errors, see above"
            exit 1
          fi
          test -s elvinluff.pdf || { echo "::error::no PDF produced"; exit 1; }
          grep -E 'Output written on elvinluff\.pdf' elvinluff.log

      - name: Upload PDF
        uses: actions/upload-artifact@v6
        with:
          name: cv-elvinluff
          path: elvinluff.pdf
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v7
        with:
          name: cv-elvinluff
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/elvinluff.pdf \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes
